name: Prefetch Football Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Call prefetch endpoint
        run: |
          curl -X GET "https://${{ secrets.VERCEL_URL }}/api/cron/prefetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
