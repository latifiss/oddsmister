name: Daily Predictions Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger predictions update
        run: |
          echo "🔄 Triggering predictions update at $(date)"
          curl -X GET https://oddsmister.vercel.app/api/predictions/update \
            -H "User-Agent: GitHub-Actions" \
            --fail \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5

      - name: Check update status
        run: |
          echo "📊 Checking update status..."
          curl -X GET https://oddsmister.vercel.app/api/predictions/status \
            -H "User-Agent: GitHub-Actions"

      - name: Log completion
        run: |
          echo "✅ Predictions update workflow completed at $(date)"
