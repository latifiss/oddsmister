name: Daily Predictions Update

on:
  schedule:
    # Test run at 11:45 AM GMT today
    - cron: '45 11 * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
  # Also trigger on push to main (for testing)
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-predictions.yml'

jobs:
  update-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger predictions update
        run: |
          echo "🔄 Triggering predictions update at $(date)"
          curl -X GET https://oddsmister.vercel.app/api/predictions/update \
            -H "User-Agent: GitHub-Actions" \
            --fail \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5

      - name: Check update status
        run: |
          echo "📊 Checking update status..."
          curl -X GET https://oddsmister.vercel.app/api/predictions/status \
            -H "User-Agent: GitHub-Actions"

      - name: Log completion
        run: |
          echo "✅ Predictions update workflow completed at $(date)"
